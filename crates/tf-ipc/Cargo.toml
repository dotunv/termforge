[package]
name = "tf-ipc"
description = "IPC transport for TermForge: named pipes (Windows) / Unix sockets (Linux) with token auth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tf-proto.workspace = true
tokio = { features = ["io-util", "macros", "net", "rt", "sync"], version = "1.36" }
tracing.workspace = true
thiserror.workspace = true
bytes = "1"
async-trait = "0.1"
futures.workspace = true
postcard = { workspace = true, features = ["use-std"] }
rand = "0.8"
hex = "0.4"
dirs = "5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
tokio = { features = ["net"], version = "1.36" }

[lints.rust]
unsafe_code = "allow"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
print_stdout = "warn"
