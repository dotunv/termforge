name: Fuzz

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [tap, proto_frame]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: fuzz ${{ matrix.target }} (10 min)
        working-directory: fuzz
        # rust-toolchain.toml pins stable; cargo-fuzz needs nightly. The
        # prebuilt cargo-fuzz is a musl binary and would default to a musl
        # target, which sanitizers do not support, so name the target.
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} -- -max_total_time=600 -max_len=65536
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts
